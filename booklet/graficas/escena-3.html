<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Escena 3</title><script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');body{font-family:'Outfit',sans-serif;color:#0d0d0d;margin:0;padding:24px;background:#fff}.card{max-width:900px;margin:0 auto;border:1px solid #e5e7eb;border-radius:12px;padding:24px}h1{font-size:20px;margin:0 0 6px}p.sub{font-size:13px;color:#4b5563;margin:0 0 18px}p.f{font-size:11px;color:#6b7280;margin-top:12px;border-top:1px solid #e5e7eb;padding-top:8px}svg{width:100%;height:auto;display:block}</style></head><body><div class="card"><h1>Escena 3 · Percepción estatal (ENVIPE) frente a carpetas registradas en Yucatán</h1><p class="sub">Carpetas anuales registradas en Yucatán (oro) contra percepción estatal (morado), 2015–2025</p><div id="c"></div><p class="f">Fuente: INEGI (ENVIPE, Yucatán) y SESNSP vía datos.gob.mx (IDVFC_NM_dic25.csv). Corte: dic 2025.</p></div><script>d3.csv("../datos/escena-3.csv",d3.autoType).then(d=>{const w=840,h=340,m={t:32,r:62,b:42,l:66},s=d3.select("#c").append("svg").attr("viewBox",`0 0 ${w} ${h}`),x=d3.scaleBand().domain(d.map(r=>r.anio)).range([m.l,w-m.r]).padding(.35),yL=d3.scaleLinear().domain([0,d3.max(d,r=>r.delitos_yucatan)*1.15]).range([h-m.b,m.t]),yR=d3.scaleLinear().domain([0,60]).range([h-m.b,m.t]);s.append("g").attr("transform",`translate(0,${h-m.b})`).call(d3.axisBottom(x));s.append("g").attr("transform",`translate(${m.l},0)`).call(d3.axisLeft(yL).ticks(5));s.append("g").attr("transform",`translate(${w-m.r},0)`).call(d3.axisRight(yR).ticks(6).tickFormat(v=>v+"%")).selectAll("text").style("fill","#600d8b");s.selectAll("rect").data(d).join("rect").attr("x",r=>x(r.anio)).attr("y",r=>yL(r.delitos_yucatan)).attr("width",x.bandwidth()).attr("height",r=>yL(0)-yL(r.delitos_yucatan)).attr("fill","#ed9f22").attr("rx",4);s.selectAll("text.b").data(d).join("text").attr("x",r=>x(r.anio)+x.bandwidth()/2).attr("y",r=>yL(r.delitos_yucatan)-6).attr("text-anchor","middle").style("font-size","10px").style("font-weight","600").style("fill","#b45309").text(r=>r.delitos_yucatan.toLocaleString("es-MX"));const c=d.filter(r=>r.percepcion_inseguridad_yucatan_pct!=null);const ln=d3.line().x(r=>x(r.anio)+x.bandwidth()/2).y(r=>yR(r.percepcion_inseguridad_yucatan_pct));s.append("path").datum(c).attr("fill","none").attr("stroke","#600d8b").attr("stroke-width",2.5).attr("d",ln);s.selectAll("circle").data(c).join("circle").attr("cx",r=>x(r.anio)+x.bandwidth()/2).attr("cy",r=>yR(r.percepcion_inseguridad_yucatan_pct)).attr("r",4.5).attr("fill","#600d8b");s.selectAll("text.e").data(c).join("text").attr("x",r=>x(r.anio)+x.bandwidth()/2).attr("y",r=>yR(r.percepcion_inseguridad_yucatan_pct)-9).attr("text-anchor","middle").style("font-size","10px").style("font-weight","700").style("fill","#600d8b").text(r=>r.percepcion_inseguridad_yucatan_pct.toFixed(1)+"%");});</script></body></html>
