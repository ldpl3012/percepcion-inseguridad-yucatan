<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escena 3 — Carpetas vs. Percepción en Yucatán</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 32px;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
      background: #ffffff;
      color: #111827;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    .yr-tag {
      font-size: 28px;
      font-weight: 900;
      color: #5b21b6;
      background: #f3e8ff;
      padding: 6px 18px;
      border-radius: 999px;
    }
    .scale-stage {
      background: #fafafa;
      border: 1.5px solid #e5e7eb;
      border-radius: 24px;
      padding: 18px 24px 14px;
    }
    .kpis {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 6px;
    }
    .kpi {
      background: #ffffff;
      border: 1.5px solid #e5e7eb;
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .kpi-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .kpi-val {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -0.03em;
    }
    .years-bar {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 16px;
    }
    .yr-btn {
      flex: 1;
      min-width: 64px;
      border: 1.5px solid #e5e7eb;
      background: #ffffff;
      border-radius: 12px;
      padding: 9px 6px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      color: #374151;
      transition: all 0.16s ease;
    }
    .yr-btn:hover { border-color: #c4b5fd; }
    .yr-btn.on {
      background: #5b21b6;
      border-color: #5b21b6;
      color: #ffffff;
    }
    .footer {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #6b7280;
    }
    .brand { font-weight: 800; color: #5b21b6; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <h1>Carpetas oficiales vs. Percepción ciudadana</h1>
      <div class="yr-tag" id="yr-tag">2025</div>
    </div>

    <section class="scale-stage">
      <div class="kpis">
        <div class="kpi">
          <span class="kpi-title" style="color:#d97706">Carpetas SESNSP</span>
          <span class="kpi-val" style="color:#d97706" id="k-del">—</span>
        </div>
        <div class="kpi">
          <span class="kpi-title" style="color:#5b21b6">Percepción ENVIPE</span>
          <span class="kpi-val" style="color:#5b21b6" id="k-perc">—</span>
        </div>
      </div>

      <div id="balance-svg"></div>
    </section>

    <div class="years-bar" id="years-bar"></div>

    <footer class="footer">
      <span>Fuente: Cruce estatal INEGI ENVIPE y SESNSP Yucatán (2015–2025). Cifra oculta estatal: 91.0%.</span>
      <span class="brand">Percepción de inseguridad en Yucatán</span>
    </footer>
  </main>

  <script>
    const fmt = d3.format(",");

    d3.csv("../datos/escena-3.csv", d => ({
      anio: +d.anio,
      delitos: +d.delitos_yucatan,
      percepcion: +d.percepcion_inseguridad_yucatan_pct
    })).then(raw => {
      const data = raw
        .filter(d => Number.isFinite(d.anio) && Number.isFinite(d.delitos) && Number.isFinite(d.percepcion))
        .sort((a, b) => a.anio - b.anio);

      const maxDel = d3.max(data, d => d.delitos) || 5461;

      const W = 880, H = 310;
      const cx = W / 2, pivotY = 148, arm = 255;

      const svg = d3.select("#balance-svg")
        .append("svg")
        .attr("viewBox", `0 0 ${W} ${H}`)
        .style("width", "100%")
        .style("height", "auto");

      // Base y columna central
      svg.append("path")
        .attr("d", `M${cx - 75} 285 L${cx + 75} 285 L${cx + 22} 262 L${cx - 22} 262 Z`)
        .attr("fill", "#111827");
      svg.append("rect")
        .attr("x", cx - 7).attr("y", pivotY).attr("width", 14).attr("height", 116).attr("rx", 6)
        .attr("fill", "#374151");

      // Viga inclinable
      const beam = svg.append("g").attr("transform", `translate(${cx},${pivotY})`);
      beam.append("line")
        .attr("x1", -arm).attr("y1", 0).attr("x2", arm).attr("y2", 0)
        .attr("stroke", "#111827").attr("stroke-width", 8).attr("stroke-linecap", "round");
      beam.append("circle").attr("r", 13).attr("fill", "#5b21b6").attr("stroke", "#ffffff").attr("stroke-width", 3);

      // Platillo izquierdo (Carpetas ámbar)
      const leftPan = svg.append("g");
      leftPan.append("line").attr("x1", 0).attr("y1", 0).attr("x2", -48).attr("y2", 62).attr("stroke", "#9ca3af").attr("stroke-width", 2.5);
      leftPan.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 48).attr("y2", 62).attr("stroke", "#9ca3af").attr("stroke-width", 2.5);
      leftPan.append("path").attr("d", "M-64 62 Q0 82 64 62 Z").attr("fill", "#d97706");
      const leftStack = leftPan.append("g");

      // Platillo derecho (Percepción morado)
      const rightPan = svg.append("g");
      rightPan.append("line").attr("x1", 0).attr("y1", 0).attr("x2", -48).attr("y2", 62).attr("stroke", "#9ca3af").attr("stroke-width", 2.5);
      rightPan.append("line").attr("x1", 0).attr("y1", 0).attr("x2", 48).attr("y2", 62).attr("stroke", "#9ca3af").attr("stroke-width", 2.5);
      rightPan.append("path").attr("d", "M-64 62 Q0 82 64 62 Z").attr("fill", "#5b21b6");
      const rightCrowd = rightPan.append("g");

      const btns = d3.select("#years-bar").selectAll("button")
        .data(data)
        .join("button")
        .attr("class", "yr-btn")
        .text(d => d.anio)
        .on("click", (_, d) => update(d.anio));

      function update(yr) {
        const r = data.find(d => d.anio === yr) || data[data.length - 1];
        btns.classed("on", d => d.anio === r.anio);
        d3.select("#yr-tag").text(r.anio);
        d3.select("#k-del").text(fmt(r.delitos));
        d3.select("#k-perc").text(`${r.percepcion.toFixed(1)}%`);

        // Peso normalizado: carpetas (0..1) vs percepción (0..1 sobre 50%)
        const wLeft = r.delitos / maxDel;
        const wRight = Math.min(1, r.percepcion / 45);
        // Ángulo en grados: positivo = cae lado derecho (percepción pesa más)
        const deg = Math.max(-18, Math.min(18, (wRight - wLeft) * 24));
        const rad = (deg * Math.PI) / 180;

        const lx = cx - Math.cos(rad) * arm;
        const ly = pivotY - Math.sin(rad) * arm;
        const rx = cx + Math.cos(rad) * arm;
        const ry = pivotY + Math.sin(rad) * arm;

        beam.transition().duration(650).ease(d3.easeElasticOut.amplitude(1).period(0.55))
          .attr("transform", `translate(${cx},${pivotY}) rotate(${deg})`);

        leftPan.transition().duration(650).ease(d3.easeElasticOut.amplitude(1).period(0.55))
          .attr("transform", `translate(${lx},${ly})`);

        rightPan.transition().duration(650).ease(d3.easeElasticOut.amplitude(1).period(0.55))
          .attr("transform", `translate(${rx},${ry})`);

        // Dibujar pila de carpetas en platillo izquierdo (1 a 10 bloques)
        leftStack.selectAll("*").remove();
        const foldersCount = Math.max(1, Math.round(wLeft * 10));
        d3.range(foldersCount).forEach(i => {
          leftStack.append("rect")
            .attr("x", -34 + (i % 2) * 4)
            .attr("y", 52 - i * 8)
            .attr("width", 64)
            .attr("height", 6.5)
            .attr("rx", 3)
            .attr("fill", i % 2 === 0 ? "#f59e0b" : "#b45309");
        });

        // Dibujar grupo de personas en platillo derecho (1 a 10 siluetas)
        rightCrowd.selectAll("*").remove();
        const pplCount = Math.max(1, Math.round(r.percepcion / 10));
        d3.range(pplCount).forEach(i => {
          const px = -36 + i * 18;
          rightCrowd.append("circle").attr("cx", px).attr("cy", 28).attr("r", 5.5).attr("fill", "#7c3aed");
          rightCrowd.append("rect").attr("x", px - 6).attr("y", 35).attr("width", 12).attr("height", 24).attr("rx", 4).attr("fill", "#5b21b6");
        });
      }

      update(data[data.length - 1].anio);
    });
  </script>
</body>
</html>
