<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Escena 2</title><script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');body{font-family:'Outfit',sans-serif;color:#0d0d0d;margin:0;padding:24px;background:#fff}.card{max-width:900px;margin:0 auto;border:1px solid #e5e7eb;border-radius:12px;padding:24px}h1{font-size:20px;margin:0 0 6px}p.sub{font-size:13px;color:#4b5563;margin:0 0 18px}p.f{font-size:11px;color:#6b7280;margin-top:12px;border-top:1px solid #e5e7eb;padding-top:8px}svg{width:100%;height:auto;display:block}</style></head><body><div class="card"><h1>Escena 2 · 18,998 carpetas de investigación acumuladas en Yucatán (2015–2025)</h1><p class="sub">Delitos registrados por mes en el estado de Yucatán (cobertura estatal, datos.gob.mx / SESNSP)</p><div id="c"></div><p class="f">Fuente: SESNSP vía datos.gob.mx (IDVFC_NM_dic25.csv, Clave_Ent=31 Yucatán). Corte: diciembre 2025.</p></div><script>
d3.csv("../datos/escena-2.csv",d3.autoType).then(d=>{const w=840,h=320,m={t:28,r:36,b:42,l:62},s=d3.select("#c").append("svg").attr("viewBox",`0 0 ${w} ${h}`),x=d3.scalePoint().domain(d.map(r=>r.periodo)).range([m.l,w-m.r]),y=d3.scaleLinear().domain([0,d3.max(d,r=>r.delitos_registrados)*1.12]).range([h-m.b,m.t]),tk=d.filter(r=>r.mes===1).map(r=>r.periodo);s.append("g").attr("transform",`translate(0,${h-m.b})`).call(d3.axisBottom(x).tickValues(tk).tickFormat(v=>v.slice(0,4)));s.append("g").attr("transform",`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5));s.append("path").datum(d).attr("fill","none").attr("stroke","#600d8b").attr("stroke-width",2.2).attr("d",d3.line().x(r=>x(r.periodo)).y(r=>y(r.delitos_registrados)));const u=d[d.length-1];s.append("circle").attr("cx",x(u.periodo)).attr("cy",y(u.delitos_registrados)).attr("r",4.5).attr("fill","#600d8b");s.append("text").attr("x",x(u.periodo)-6).attr("y",y(u.delitos_registrados)-10).attr("text-anchor","end").style("font-weight","700").style("font-size","12px").style("fill","#600d8b").text(`${u.periodo}: ${u.delitos_registrados.toLocaleString("es-MX")}`);});
</script></body></html>
