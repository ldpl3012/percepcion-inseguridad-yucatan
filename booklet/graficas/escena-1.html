<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Escena 1</title><script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');body{font-family:'Outfit',sans-serif;color:#0d0d0d;margin:0;padding:24px;background:#fff}.card{max-width:900px;margin:0 auto;border:1px solid #e5e7eb;border-radius:12px;padding:24px}h1{font-size:20px;margin:0 0 6px}p.sub{font-size:13px;color:#4b5563;margin:0 0 18px}p.f{font-size:11px;color:#6b7280;margin-top:12px;border-top:1px solid #e5e7eb;padding-top:8px}svg{width:100%;height:auto;display:block}</style></head><body><div class="card"><h1>Escena 1 · 35.48% de la población adulta en Yucatán percibe inseguridad (2026)</h1><p class="sub">Serie histórica de percepción de inseguridad en Yucatán por sexo (ENVIPE 2011–2026)</p><div id="c"></div><p class="f">Fuente: INEGI, ENVIPE 2011–2026 (Yucatán). Corte: 2026.</p></div><script>d3.csv("../datos/escena-1.csv",d3.autoType).then(d=>{const w=840,h=340,m={t:28,r:54,b:40,l:52},s=d3.select("#c").append("svg").attr("viewBox",`0 0 ${w} ${h}`),x=d3.scalePoint().domain(d.map(r=>r.anio)).range([m.l,w-m.r]).padding(.2),y=d3.scaleLinear().domain([0,60]).range([h-m.b,m.t]);s.append("g").attr("transform",`translate(0,${h-m.b})`).call(d3.axisBottom(x).tickValues(d.filter(r=>r.anio%2===0).map(r=>r.anio)));s.append("g").attr("transform",`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(6).tickFormat(v=>v+"%"));const series=[{k:"porcentaje_inseguridad_mujeres",c:"#9C27B0",d:null},{k:"porcentaje_inseguridad_total",c:"#D4AF37",d:"4,3"},{k:"porcentaje_inseguridad_hombres",c:"#5E35B1",d:null}];series.forEach(sr=>{const ln=d3.line().x(r=>x(r.anio)).y(r=>y(r[sr.k]));s.append("path").datum(d).attr("fill","none").attr("stroke",sr.c).attr("stroke-width",2.5).attr("stroke-dasharray",sr.d||"none").attr("d",ln);s.selectAll(null).data(d).join("circle").attr("cx",r=>x(r.anio)).attr("cy",r=>y(r[sr.k])).attr("r",3.2).attr("fill",sr.c);const ult=d[d.length-1];s.append("text").attr("x",x(ult.anio)+6).attr("y",y(ult[sr.k])+4).style("font-size","11px").style("font-weight","700").style("fill",sr.c).text(ult[sr.k].toFixed(1)+"%");});});</script></body></html>
