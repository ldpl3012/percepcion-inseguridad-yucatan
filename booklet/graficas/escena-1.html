<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Escena 1</title><script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script><style>@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');body{font-family:'Outfit',sans-serif;color:#0d0d0d;margin:0;padding:24px;background:#fff}.card{max-width:900px;margin:0 auto;border:1px solid #e5e7eb;border-radius:12px;padding:24px}h1{font-size:20px;margin:0 0 6px}p.sub{font-size:13px;color:#4b5563;margin:0 0 18px}p.f{font-size:11px;color:#6b7280;margin-top:12px;border-top:1px solid #e5e7eb;padding-top:8px}svg{width:100%;height:auto;display:block}</style></head><body><div class="card"><h1>Escena 1 · 35.38% de la población adulta en Mérida se siente insegura</h1><p class="sub">Porcentaje ponderado de población de 18+ años que percibe inseguridad en Mérida, Yucatán (ENSU 2026)</p><div id="c"></div><p class="f">Fuente: INEGI, ENSU 1T–3T 2026 (Mérida, Yucatán). Corte: 2026.</p></div><script>
d3.csv("../datos/escena-1.csv",d3.autoType).then(d=>{const w=840,h=320,m={t:28,r:30,b:42,l:54},s=d3.select("#c").append("svg").attr("viewBox",`0 0 ${w} ${h}`),x=d3.scaleBand().domain(d.map(r=>r.periodo)).range([m.l,w-m.r]).padding(.45),y=d3.scaleLinear().domain([0,100]).range([h-m.b,m.t]);s.append("g").attr("transform",`translate(0,${h-m.b})`).call(d3.axisBottom(x));s.append("g").attr("transform",`translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(v=>v+"%"));s.selectAll("rect").data(d).join("rect").attr("x",r=>x(r.periodo)).attr("y",r=>y(r.porcentaje_inseguridad)).attr("width",x.bandwidth()).attr("height",r=>y(0)-y(r.porcentaje_inseguridad)).attr("fill","#600d8b").attr("rx",6);s.selectAll("text.v").data(d).join("text").attr("x",r=>x(r.periodo)+x.bandwidth()/2).attr("y",r=>y(r.porcentaje_inseguridad)-8).attr("text-anchor","middle").style("font-weight","700").style("fill","#600d8b").text(r=>r.porcentaje_inseguridad.toFixed(1)+"%");});
</script></body></html>
